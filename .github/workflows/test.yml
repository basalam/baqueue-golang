name: Go
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: baqueue_test
          POSTGRES_DB: baqueue_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BAQUEUE_REDIS_URL: redis://localhost:6379/0
      BAQUEUE_POSTGRES_URL: postgres://postgres:baqueue_test@localhost:5432/baqueue_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build ./...
